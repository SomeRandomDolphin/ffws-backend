# Graf jaringan 15 stasiun DAS Welang (hulu -> hilir).
#
# Data acuan 2022/2023 adalah keluaran model, bukan observasi. Konfigurasi
# topologi di bawah adalah ASUMSI eksplisit untuk simulator jaringan; urutan
# cabang konsisten dengan src/dhompo/data/clusters.py dan metadata stasiun.
#
# Catatan:
# - `elevation_m` = datum tabel elevasi (meter), dipakai untuk skala relatif.
# - `travel_hours_to_target` = estimasi waktu tempuh ke Dhompo (jam); 3 anchor
#   resmi (Purwodadi 3.5, AWLR Kademungan 2.0, Klosod 1.0) + regresi elevasi.
# - `edges` = reach hulu -> hilir; `travel_hours` adalah waktu tempuh reach.
#   Nilai ini dipakai sebagai parameter awal (K) simulator Muskingum.

version: 1
target: Dhompo
downstream_aux: Jalan Nasional

defaults:
  routing: network_transfer
  horizon_hours: [1, 2, 3, 4, 5, 6]

stations:
  - name: Bd. Sentono
    elevation_m: 680.536
    travel_hours_to_target: 3.5
    branch: west
    role: aux
  - name: Bd. Suwoto
    elevation_m: 503.0
    travel_hours_to_target: 5.5
    branch: west
    role: upstream
  - name: Krajan Timur
    elevation_m: 335.0
    travel_hours_to_target: 4.0
    branch: west
    role: upstream
  - name: Purwodadi
    elevation_m: 287.0
    travel_hours_to_target: 3.5
    branch: west
    role: upstream
  - name: Bd. Baong
    elevation_m: 169.0
    travel_hours_to_target: 2.5
    branch: west
    role: upstream
  - name: Bd. Lecari
    elevation_m: 167.0
    travel_hours_to_target: 2.5
    branch: east
    role: upstream
  - name: Bd. Bakalan
    elevation_m: 136.0
    travel_hours_to_target: 2.0
    branch: west
    role: upstream
  - name: AWLR Kademungan
    elevation_m: 128.0
    travel_hours_to_target: 2.0
    branch: west
    role: upstream
  - name: Bd. Domas
    elevation_m: 57.0
    travel_hours_to_target: 1.5
    branch: west
    role: upstream
  - name: Bd Guyangan
    elevation_m: 32.0
    travel_hours_to_target: 1.0
    branch: east
    role: upstream
  - name: Bd. Grinting
    elevation_m: 28.0
    travel_hours_to_target: 1.0
    branch: west
    role: upstream
  - name: Sidogiri
    elevation_m: 24.0
    travel_hours_to_target: 1.0
    branch: east
    role: upstream
  - name: Klosod
    elevation_m: 22.0
    travel_hours_to_target: 1.0
    branch: east
    role: upstream
  - name: Dhompo
    elevation_m: 7.0
    travel_hours_to_target: 0.0
    branch: ""
    role: target
  - name: Jalan Nasional
    elevation_m: 1.8
    travel_hours_to_target: 0.0
    branch: ""
    role: local

edges:
  # Cabang barat (Bd. Sentono bergabung di Purwodadi, lihat konfigurasi topologi)
  - { upstream: Bd. Sentono,     downstream: Purwodadi,      travel_hours: 1.5 }
  - { upstream: Bd. Suwoto,      downstream: Krajan Timur,   travel_hours: 1.5 }
  - { upstream: Krajan Timur,    downstream: Purwodadi,      travel_hours: 1.0 }
  - { upstream: Purwodadi,       downstream: Bd. Baong,      travel_hours: 1.0 }
  - { upstream: Bd. Baong,       downstream: Bd. Bakalan,    travel_hours: 0.5 }
  - { upstream: Bd. Bakalan,     downstream: AWLR Kademungan, travel_hours: 0.5 }
  - { upstream: AWLR Kademungan, downstream: Bd. Domas,      travel_hours: 1.0 }
  - { upstream: Bd. Domas,       downstream: Bd. Grinting,   travel_hours: 0.5 }
  - { upstream: Bd. Grinting,    downstream: Dhompo,         travel_hours: 0.5 }
  # Cabang timur
  - { upstream: Bd. Lecari,      downstream: Bd Guyangan,    travel_hours: 1.5 }
  - { upstream: Bd Guyangan,     downstream: Sidogiri,       travel_hours: 0.5 }
  - { upstream: Sidogiri,        downstream: Klosod,         travel_hours: 0.5 }
  - { upstream: Klosod,          downstream: Dhompo,         travel_hours: 1.0 }
  # Lokal hilir target
  - { upstream: Dhompo,          downstream: Jalan Nasional, travel_hours: 0.5 }
