# Baseline Fase 1: prediksi seluruh 15 stasiun untuk +1 sampai +6 jam.

train_split: 0.8
horizons: [1, 2, 3, 4, 5, 6]
include_rainfall: false
random_state: 42

data_sources:
  - path: "../../data/data-clean.csv"
    format: csv
    label: "2022_clean"
  - path: "../../data/Data generated 2023.xlsx"
    format: xlsx_generated
    label: "2023_generated"

models:
  ridge:
    alpha: 1.0
  hist_gradient_boosting:
    learning_rate: 0.05
    max_iter: 150
    max_depth: 6
    l2_regularization: 1.0

output:
  model_dir: "../../models/sklearn/multistation"
  report_dir: "../../reports/dhompo/tables"
