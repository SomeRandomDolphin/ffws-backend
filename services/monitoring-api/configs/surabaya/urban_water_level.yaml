# Preprocessing defaults for data/surabaya/ketinggian_30menit_wide.csv.
#
# This is intentionally separate from configs/dhompo/training.yaml because the
# existing Dhompo models require a different station schema.

data_path: "../../data/surabaya/ketinggian_30menit_wide.csv"
timestamp_column: "timestamp"
cadence_minutes: 30

# Default target for the first real-time prototype. Hang Tuah has the highest
# observed water-level coverage in the current CSV.
target_column: "ketinggian_lokasi_1_hang_tuah"

min_history_rows: 24
max_ffill_steps: 12

train_split: 0.8
horizons: [1, 2, 3, 4, 5]
models_output_dir: "../../models/surabaya/urban"
target_mode: "persistence_residual"  # "level", "delta", or "persistence_residual"

cleaning:
  target:
    enabled: true
    zero_as_outlier: true
    min_cm: 1.0
    max_cm: 1000.0
    max_step_change_cm: 100.0

features:
  include_quality_flags: true
  min_coverage: 0.05
  lag_steps: [1, 2, 3]
  rolling_windows:
    - steps: 6
      label: "3h"
    - steps: 12
      label: "6h"
    - steps: 24
      label: "12h"

locations:
  - key: "lokasi_1_hang_tuah"
    name: "Hang Tuah"
    water_level:
      canonical: "ketinggian_lokasi_1_hang_tuah"
      components:
        - "ketinggian_lokasi_1_a_hang_tuah"
        - "ketinggian_lokasi_1_b_hang_tuah"
    rainfall:
      canonical: "curah_hujan_lokasi_1_hang_tuah"
      components:
        - "curah_hujan_lokasi_1_a_hang_tuah"
        - "curah_hujan_lokasi_1_b_hang_tuah"

  - key: "lokasi_2_kalibokor"
    name: "Kalibokor"
    water_level:
      canonical: "ketinggian_lokasi_2_kalibokor"
      components:
        - "ketinggian_lokasi_2_a_kalibokor"
        - "ketinggian_lokasi_2_b_kalibokor"
    rainfall:
      canonical: "curah_hujan_lokasi_2_kalibokor"
      components:
        - "curah_hujan_lokasi_2_a_kalibokor"
        - "curah_hujan_lokasi_2_b_kalibokor"

  - key: "lokasi_3_rumah_pompa_pucang"
    name: "Rumah Pompa Pucang"
    water_level:
      canonical: "ketinggian_lokasi_3_rumah_pompa_pucang"
      components:
        - "ketinggian_lokasi_3_a_rumah_pompa_pucang"
        - "ketinggian_lokasi_3_b_rumah_pompa_pucang"
    rainfall:
      canonical: "curah_hujan_lokasi_3_rumah_pompa_pucang"
      components:
        - "curah_hujan_lokasi_3_a_rumah_pompa_pucang"
        - "curah_hujan_lokasi_3_b_rumah_pompa_pucang"

  - key: "lokasi_4_pln_menur"
    name: "Sebrang Perpustakaan Jawa Timur"
    water_level:
      canonical: "ketinggian_lokasi_4_pln_menur"
      components:
        - "ketinggian_lokasi_4_a_pln_menur"
        - "ketinggian_lokasi_4_b_pln_menur"
    rainfall:
      canonical: "curah_hujan_lokasi_4_pln_menur"
      components:
        - "curah_hujan_lokasi_4_a_pln_menur"
        - "curah_hujan_lokasi_4_b_pln_menur"
