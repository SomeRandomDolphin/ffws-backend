# Konfigurasi metadata dan parameter prediksi DAS Dhompo
#
# Basis demo: data-clean.csv (2022), datum elevasi.
# Threshold status diturunkan dari data (persentil) agar otomatis menyesuaikan
# skala tiap stasiun.

data:
  # Gold dataset hasil `make gold` dipakai bila tersedia; `path` jadi fallback.
  gold_path: "../../data/gold/hydro.csv"
  path: "../../data/data-clean.csv"
  history_rows: 24        # baris riwayat 30 menit yang dipakai sebagai input prediksi
  lead_hours: [0, 1, 2, 3, 4, 5]

thresholds:
  alert_quantile: 0.90    # waspada jika tinggi air >= persentil ke-90 stasiun
  danger_quantile: 0.99   # bahaya  jika tinggi air >= persentil ke-99 stasiun
  rising_delta_m: 0.25    # "meningkat" jika kenaikan 3 jam melebihi ambang (m)
  # Override per stasiun bila threshold resmi tersedia (meter pada datum yang sama):
  station_overrides:
    Dhompo:
      alert: null
      danger: null

demo:
  # opsional: datetime tetap untuk window demo (null = pilih otomatis saat pertama
  # kali Dhompo melewati alert_quantile, dengan `history_rows` baris sebelumnya)
  window_end: null
  # Segmen gold yang dipakai (2022_clean / 2023_generated); null = segmen terakhir.
  segment: null

propagation:
  # Waktu tempuh (jam) ke Dhompo: 3 stasiun telemetri resmi dari
  # docs/dhompo/ARCHITECTURE.md; sisanya diestimasi linear dari elevasi.
  travel_hours_anchor:
    Purwodadi: 3.5
    AWLR Kademungan: 2.0
    Klosod: 1.0